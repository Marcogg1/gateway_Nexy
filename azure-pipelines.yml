pool:
  vmImage: windows-latest

jobs:
- job: DeliveryCheck
  timeoutInMinutes: 20
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.14'

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements_host.txt
    displayName: 'Install dependencies'

  - task: PythonScript@0
    inputs:
      scriptSource: 'filePath'
      scriptPath: 'utils/delivery_check.py'
      arguments: '-a -x -l -u'
